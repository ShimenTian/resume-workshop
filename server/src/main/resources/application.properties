server.address=127.0.0.1
server.port=8081
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.connection-timeout=10s
# Public website mode stores documents on each user's computer, not on this server.
resume.storage.api-enabled=false
spring.datasource.url=jdbc:h2:file:./data/resumes;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.web.resources.static-locations=file:../dist/
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
